name: python
on:
  push:
    paths: ["python/**", "web/public/data/ephem/**", "contracts/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", "web/public/data/ephem/**", "contracts/**", ".github/workflows/python.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run pytest -q

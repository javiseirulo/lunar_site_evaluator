[project]
name = "lunar-pipeline"
version = "0.1.0"
description = "Offline pipeline for the Lunar Landing Site Navigator: SPICE ephemerides, topocentric Sun/Earth geometry and exports for the web app."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23",
    "numpy>=2.0,<3",
    "pyyaml>=6.0",
    "requests>=2.32",
    "spiceypy>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ephem", "export"]

[tool.ruff]
line-length = 100
target-version = "py312"
# python/terrain is Pablo's package, checked by .github/workflows/terrain.yml.
extend-exclude = ["terrain"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The validation report is written in Spanish with typographic symbols (×, −, –).
"ephem/horizons_check.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

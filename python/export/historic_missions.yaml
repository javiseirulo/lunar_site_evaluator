# Mission content for the Historical mode of the Mission game (issue #114).
#
# Game rules and idea: @Manuelcgg165 (2026-11-15). Content written with AI help and reviewed by the team:
# the dialogues are light, kid-friendly dramatisations (declared as such in the game), not quotes.
#
# Per mission:
#   landing_utc  real touchdown (or crash) time, UTC, from the mission records (NSSDC master catalog,
#                agency reports); the Sun and Earth are computed for this instant with SPICE (DE440).
#   light        landing-light rule (sun elevation at touchdown, degrees):
#                  crewed  -> 5..20  (Apollo flew with the Sun 5-14 deg up: long shadows show the rocks)
#                  optical -> 2..60  (camera / hazard-avoidance landers need light)
#                  radar   -> none   (1960s-70s automatic landers came down on radar alone)
#   surface_days how long the mission must survive (7 like South Pole; shorter for 1-day sample returns)
#   relay        true on the far side: the Earth link goes through a relay satellite (Queqiao)
#   options      the real site (history: true) and realistic alternatives:
#                  basis: flown | candidate (documented candidate/backup site) | nearby (another spot in
#                  the same region, illustrative) ; coordinates from the source or the IAU gazetteer
#                  (web/public/data/terrain/lunar-names.json). catalog_id = use that South Pole site's
#                  terrain horizon.
#   alarm        only where something really went wrong during the descent (scene = existing effect)
#
# Sources: NSSDC lunar landing sites https://nssdc.gsfc.nasa.gov/planetary/lunar/lunar_sites.html ;
# NASA "50 years ago, lunar landing sites selected" (ALS-1..5); NASA SP-4214 ch. 12 (Apollo 15-17 site
# selection); Luna 25 backups (Roscosmos, via Global Security); Chandrayaan-2 backup (ISRO, via Space.com);
# Chandrayaan-3 ALS (PRL, arXiv:2308.10712, "~450 km west" at the same latitude); IAU/USGS gazetteer.

light_rules:
  crewed: { min: 5, max: 20 }
  optical: { min: 2, max: 60 }
  radar: null

missions:
  - id: luna_9
    name: Luna 9
    country: USSR
    year: 1966
    landing_utc: "1966-02-03T18:45:30Z"
    light: radar
    surface_days: 3
    narrator: { name: Luna 9, role: "the bouncy ball lander", art: luna_9 }
    intro:
      - "Privet! I am Luna 9, a lander shaped like a beach ball with petals."
      - "Nobody has EVER landed softly on the Moon. Some scientists think the ground is deep, fluffy dust that will swallow me whole!"
      - "My plan: an airbag-like bounce, then I open my petals and take the first photos from the surface."
      - "My batteries last about three days. Pick a spot where I can do my job!"
    briefing:
      - "We are over Oceanus Procellarum, a huge dark plain of old lava."
      - "Four spots are in reach. Choose where I touch down!"
    fact: "Luna 9 proved the Moon's surface is firm enough to land on: no bottomless dust!"
    options:
      - { id: real, name: "Oceanus Procellarum (west of Reiner/Marius)", lat: 7.13, lon: -64.37, basis: flown, history: true }
      - { id: reiner, name: "Reiner Gamma swirl", lat: 7.385, lon: -58.958, basis: nearby }
      - { id: marius, name: "Near Marius crater", lat: 11.897, lon: -50.836, basis: nearby }
      - { id: flamsteed, name: "Near Flamsteed crater", lat: -4.491, lon: -44.34, basis: nearby }

  - id: surveyor_1
    name: Surveyor 1
    country: USA
    year: 1966
    landing_utc: "1966-06-02T06:17:36Z"
    light: radar
    surface_days: 7
    narrator: { name: Surveyor 1, role: "the three-legged robot", art: surveyor_1 }
    intro:
      - "Howdy! Surveyor 1 here: three legs, one camera, zero fear."
      - "My job is to land gently and check whether astronauts can land here later."
      - "No crew aboard, so if I wobble, nobody spills their coffee."
      - "I run on solar power, so I need lots of daylight in the next week."
    briefing:
      - "Apollo planners gave us a list of smooth plains to test."
      - "Pick one where I will get sunshine and keep talking to Earth."
    fact: "Surveyor 1 sent back over 11,000 pictures and showed Apollo where it was safe to land."
    options:
      - { id: real, name: "Flamsteed P (Oceanus Procellarum)", lat: -2.4745, lon: -43.3398, basis: flown, history: true }
      - { id: als5, name: "Apollo candidate ALS-5", lat: 1.667, lon: -41.667, basis: candidate }
      - { id: sinus_medii, name: "Sinus Medii", lat: 1.63, lon: 1.03, basis: candidate }
      - { id: reiner, name: "Reiner Gamma swirl", lat: 7.385, lon: -58.958, basis: nearby }

  - id: luna_13
    name: Luna 13
    country: USSR
    year: 1966
    landing_utc: "1966-12-24T18:01:00Z"
    light: radar
    surface_days: 4

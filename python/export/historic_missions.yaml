    options:
      - { id: real, name: "Mare Fecunditatis", lat: -0.5137, lon: 56.3638, basis: flown, history: true }
      - { id: messier, name: "Near Messier crater", lat: -1.904, lon: 47.653, basis: nearby }
      - { id: taruntius, name: "Near Taruntius crater", lat: 5.502, lon: 46.543, basis: nearby }
      - { id: sinus_medii, name: "Sinus Medii", lat: 1.63, lon: 1.03, basis: nearby }

  - id: luna_17

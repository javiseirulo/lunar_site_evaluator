    options:
      - { id: real, name: "Mare Imbrium", lat: 38.23764, lon: -35.00163, basis: flown, history: true }
      - { id: sinus_iridum, name: "Sinus Iridum", lat: 45.01, lon: -31.665, basis: nearby }
      - { id: pico, name: "Near Mons Pico", lat: 45.82, lon: -8.87, basis: nearby }
      - { id: copernicus, name: "Copernicus crater", lat: 9.621, lon: -20.079, basis: nearby }

  - id: apollo_14

      - "We aim for the eastern Oceanus Procellarum."
      - "Choose where I land: daylight and a good view of Earth, please."
    fact: "Apollo 12 landed just 180 m from Surveyor 3 and brought its camera back to Earth."
    options:
      - { id: real, name: "Oceanus Procellarum (Surveyor crater)", lat: -3.0162, lon: -23.418, basis: flown, history: true }
      - { id: als5, name: "Apollo candidate ALS-5", lat: 1.667, lon: -41.667, basis: candidate }
      - { id: sinus_medii, name: "Sinus Medii", lat: 1.63, lon: 1.03, basis: candidate }
      - { id: lalande, name: "Near Lalande crater", lat: -4.456, lon: -8.647, basis: nearby }

  - id: surveyor_5
    name: Surveyor 5
    country: USA
    year: 1967
    landing_utc: "1967-09-11T00:46:44Z"
    light: radar
    surface_days: 7
    narrator: { name: Surveyor 5, role: "the robot chemist", art: surveyor_5 }
    intro:
      - "Surveyor 5 here, and I am a chemist!"
      - "I carry an instrument that tells us what lunar soil is made of."
      - "Small problem: one of my fuel tanks is leaking. Engineers invented a brand new landing plan on the fly."
      - "Help me pick a landing spot before the leak gets worse."
    briefing:
      - "We are over Mare Tranquillitatis, the future home of Apollo 11."
      - "Choose a site with sunlight and Earth in view."
    fact: "Surveyor 5 found the dark lunar plains are made of basalt, like volcanic rock on Earth."
    alarm:
      scene: fuel_leak
      title: "Helium Leak"
      alarm: "PRESSURE LOSS — NEW DESCENT PLAN"
      briefing: "A pressure leak means we must fly a brand new descent plan. Pick the site now, before the tanks run low!"
    options:
      - { id: real, name: "Mare Tranquillitatis", lat: 1.4551, lon: 23.1943, basis: flown, history: true }
      - { id: als1, name: "Apollo candidate ALS-1", lat: 2.667, lon: 34.0, basis: candidate }
      - { id: censorinus, name: "Near Censorinus crater", lat: -0.417, lon: 32.691, basis: nearby }
      - { id: sinus_medii, name: "Sinus Medii", lat: 1.63, lon: 1.03, basis: candidate }

  - id: surveyor_6
    name: Surveyor 6
    country: USA
    year: 1967
    landing_utc: "1967-11-10T01:01:06Z"
    light: radar
    surface_days: 7
    narrator: { name: Surveyor 6, role: "the robot that hopped", art: surveyor_6 }
    intro:

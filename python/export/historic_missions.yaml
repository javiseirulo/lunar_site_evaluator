      - { id: apollonius, name: "Near Apollonius crater", lat: 4.505, lon: 60.965, basis: nearby }
      - { id: firmicus, name: "Near Firmicus crater", lat: 7.246, lon: 63.426, basis: nearby }
      - { id: taruntius, name: "Near Taruntius crater", lat: 5.502, lon: 46.543, basis: nearby }

  - id: apollo_16
    name: Apollo 16
    country: USA
    year: 1972
    landing_utc: "1972-04-21T02:23:35Z"
    light: crewed
    surface_days: 7
    narrator: { name: John Young, role: "Commander, Apollo 16", art: apollo_16 }
    intro:
      - "John Young here! We're the first to land in the Moon's bright highlands."
      - "Scientists expect volcanic rocks. Spoiler: they are in for a surprise."

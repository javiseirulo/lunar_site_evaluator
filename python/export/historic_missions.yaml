    country: USA
    year: 1971
    landing_utc: "1971-02-05T09:18:11Z"
    light: crewed
    surface_days: 7
    narrator: { name: Alan Shepard, role: "Commander, Apollo 14", art: apollo_14 }
    intro:
      - "Al Shepard here. First American in space, and now I'm going to the Moon!"
      - "We're going to Fra Mauro, the site Apollo 13 never reached."
      - "I've also sneaked a golf club head into my pocket. Don't tell anyone."
      - "Remember: land with the Sun low, so the shadows show us the rocks."
    briefing:
      - "A loose bit of solder is triggering the ABORT signal by itself!"
      - "Engineers are reprogramming the computer. Meanwhile, choose the site."
    fact: "Alan Shepard hit two golf balls on the Moon. One went 'miles and miles' (really about 40 m)."
    alarm:
      scene: guidance
      title: "Phantom Abort Signal"
      alarm: "ABORT SWITCH FAULT — REPROGRAMMING"
      briefing: "The abort switch is sending fake signals! Engineers are typing a fix right now. Choose our landing site!"
    options:
      - { id: real, name: "Fra Mauro highlands", lat: -3.64589, lon: -17.47194, basis: flown, history: true }
      - { id: littrow, name: "Littrow area", lat: 21.504, lon: 31.394, basis: candidate }
      - { id: censorinus, name: "Censorinus area", lat: -0.417, lon: 32.691, basis: candidate }
      - { id: descartes, name: "Descartes highlands", lat: -8.9734, lon: 15.5011, basis: candidate }

  - id: apollo_15

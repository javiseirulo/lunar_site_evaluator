      - { id: marius, name: "Near Marius crater", lat: 11.897, lon: -50.836, basis: nearby }
      - { id: gruithuisen, name: "Mons Gruithuisen Gamma", lat: 36.559, lon: -40.721, basis: nearby }
      - { id: reiner, name: "Reiner Gamma swirl", lat: 7.385, lon: -58.958, basis: nearby }

  - id: surveyor_3
    name: Surveyor 3
    country: USA
    year: 1967
    landing_utc: "1967-04-20T00:04:17Z"
    light: radar
    surface_days: 7
    narrator: { name: Surveyor 3, role: "the robot with a scoop", art: surveyor_3 }
    intro:
      - "Surveyor 3 reporting! This time I carry a little claw to dig trenches."
      - "Fun secret: my engines will not shut off in time and I will bounce... twice."
      - "Two and a half years from now, Apollo 12 astronauts will visit me and take some of my parts home!"

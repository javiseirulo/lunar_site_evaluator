      - "After landing I will do something no one has done: fire my engines and HOP to a new spot!"
      - "Just three metres, but hey, the first lift-off from the Moon."
      - "Pick where I land first, in the middle of the Moon's near side."
    briefing:
      - "We are heading for Sinus Medii, the Bay in the Middle."
      - "Choose a site where I will have daylight for my hop."
    fact: "Surveyor 6 made the first lift-off from the Moon: a 3-metre hop, a rehearsal for Apollo."
    options:
      - { id: real, name: "Sinus Medii", lat: 0.4742, lon: -1.4275, basis: flown, history: true }
      - { id: als2, name: "Apollo candidate ALS-2", lat: 0.674, lon: 23.473, basis: candidate }
      - { id: lalande, name: "Near Lalande crater", lat: -4.456, lon: -8.647, basis: nearby }
      - { id: flamsteed, name: "Near Flamsteed crater", lat: -4.491, lon: -44.34, basis: nearby }

  - id: surveyor_7
    name: Surveyor 7
    country: USA
    year: 1968
    landing_utc: "1968-01-10T01:05:36Z"
    light: radar
    surface_days: 7
    narrator: { name: Surveyor 7, role: "the scientist robot", art: surveyor_7 }
    intro:
      - "Surveyor 7 here! My brothers already proved Apollo can land on the plains."
      - "So scientists said: let's go somewhere WILD. The rim of Tycho, a young, rocky crater."
      - "Boulders everywhere. Careful steering needed!"
      - "Help me choose the landing spot."
    briefing:
      - "Tycho is far south, in the bright highlands."
      - "Pick a site with enough sunlight and Earth in view."
    fact: "Surveyor 7 saw laser beams fired from Earth: the first laser contact with the Moon."
    options:
      - { id: real, name: "North rim of Tycho", lat: -40.9812, lon: -11.5127, basis: flown, history: true }
      - { id: alphonsus, name: "Alphonsus crater", lat: -13.388, lon: -2.846, basis: candidate }
      - { id: vitello, name: "Near Vitello crater", lat: -30.419, lon: -37.551, basis: nearby }
      - { id: gassendi, name: "Gassendi crater", lat: -17.555, lon: -39.964, basis: candidate }

  - id: apollo_11
    name: Apollo 11
    country: USA
    year: 1969
    landing_utc: "1969-07-20T20:17:40Z"
    light: crewed
    surface_days: 7
    narrator: { name: Neil Armstrong, role: "Commander, Apollo 11", art: apollo_11 }
    intro:
      - "Hello, I'm Neil. Buzz and I are riding the lunar module Eagle down to the Moon."
      - "Nobody has ever walked on the Moon. No pressure!"
      - "The Sun must be LOW when we land: long shadows show us every rock and crater."
      - "Too dark and we see nothing. Too bright and the ground looks flat as a pancake."
    briefing:
      - "The computer keeps beeping and the ground below is full of boulders."
      - "Mission control gave us five candidate sites. Four are in reach today. Choose!"
    fact: "Apollo 11 landed with the Sun about 10 degrees up and only seconds of spare fuel."
    alarm:
      scene: guidance
      title: "Program Alarm 1202"
      alarm: "1202 — GUIDANCE COMPUTER OVERLOADED"
      briefing: "The guidance computer is overloaded and keeps restarting! Houston says: keep going. Pick our landing site, fast!"
    options:
      - { id: real, name: "ALS-2 Mare Tranquillitatis (Tranquility Base)", lat: 0.67416, lon: 23.47314, basis: flown, history: true }
      - { id: als1, name: "ALS-1 Eastern Mare Tranquillitatis", lat: 2.667, lon: 34.0, basis: candidate }
      - { id: als3, name: "ALS-3 Sinus Medii", lat: 0.417, lon: -1.333, basis: candidate }
      - { id: als5, name: "ALS-5 Oceanus Procellarum", lat: 1.667, lon: -41.667, basis: candidate }

  - id: apollo_12
    name: Apollo 12
    country: USA
    year: 1969
    landing_utc: "1969-11-19T06:54:35Z"
    light: crewed
    surface_days: 7
    narrator: { name: Pete Conrad, role: "Commander, Apollo 12", art: apollo_12 }
    intro:
      - "Whoopie! Pete Conrad here. That may have been a small step for Neil, but it's a long one for me!"
      - "Our mission: a PINPOINT landing right next to an old robot, Surveyor 3."
      - "Oh, and our rocket got hit by lightning. Twice. During launch."
      - "We're fine! Mostly. Let's land with the Sun low behind us."
    briefing:
      - "The lightning scrambled our instruments for a while."
      - "Choose the landing site: the Surveyor 3 crater or one of the backup sites."
    fact: "Apollo 12 landed within walking distance of Surveyor 3 and brought pieces of it home."
    alarm:
      scene: guidance
      title: "Lightning Strike"
      alarm: "POWER GLITCH — ALL WARNING LIGHTS ON"
      briefing: "Lightning knocked our power out for a moment and every warning light came on! Systems are back. Now choose where we land!"
    options:
      - { id: real, name: "Surveyor 3 site, Oceanus Procellarum", lat: -3.0128, lon: -23.4219, basis: flown, history: true }
      - { id: als5, name: "ALS-5 Oceanus Procellarum (backup)", lat: 1.667, lon: -41.667, basis: candidate }
      - { id: als3, name: "ALS-3 Sinus Medii", lat: 0.417, lon: -1.333, basis: candidate }
      - { id: fra_mauro, name: "Fra Mauro highlands", lat: -3.6459, lon: -17.4719, basis: candidate }


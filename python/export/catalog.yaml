# Curated landing-site catalog (issue #48). Whole Moon, south-pole emphasis.
# Every coordinate below is copied from the cited source (no invented values).
# Longitudes published as 0..360 E or as W have been converted to east-positive -180..180.
# The 20 ids of the v1 mock (web/public/data/sites.json) are kept, in their original order.
version: 1
generated: 2026-11-14
notes: "Coordinates: planetocentric latitude, east-positive longitude in degrees, -180..180. Sources use the Moon mean-Earth/polar-axis (ME) frame: LROC and De Rosa et al. 2012 state ME (DE421); the LOLA-based studies (Glaser 2018, Wueller 2026) inherit the LOLA ME/DE421 frame. On the spherical lunar reference 'geodetic' latitude equals planetocentric latitude. DE421 vs DE440 ME realisation differences are not corrected here. precision: published_point = a specific point given by the source; region_representative_point = centre of a published region/RoI; landed_position = imaged lander position; unsourced_mock = no source (none at present)."
